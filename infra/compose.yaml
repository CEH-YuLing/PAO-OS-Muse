name: pao
services:
  search:
    profiles: ["search"]
    image: searxng/searxng@sha256:ef87e0f28f21f069fbf8c3742da8648edcdc2dccc9232732d35fce1eb41b7861
    restart: unless-stopped
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    mem_limit: 384m
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pao}
      POSTGRES_DB: ${POSTGRES_DB:-pao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local.py}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init_local.py}
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  temporal-setup:
    profiles: ["automation"]
    image: temporalio/admin-tools:1.30.6
    restart: on-failure:6
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pao}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?Run scripts/init_local.py}
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local.py}
    volumes: ["./temporal/setup-postgres.sh:/scripts/setup-postgres.sh:ro"]
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]
    depends_on:
      postgres: {condition: service_healthy}
  temporal:
    profiles: ["automation"]
    image: temporalio/server:1.30.6
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pao}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?Run scripts/init_local.py}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
    ports: ["127.0.0.1:7233:7233"]
    volumes: ["./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 30
    depends_on:
      temporal-setup: {condition: service_completed_successfully}
  temporal-namespace:
    profiles: ["automation"]
    image: temporalio/admin-tools:1.30.6
    restart: on-failure:5
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes: ["./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro"]
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]
    depends_on:
      temporal: {condition: service_healthy}
  migrate:
    profiles: ["app"]
    build: {context: .., dockerfile: infra/api.Dockerfile}
    env_file: ../.env
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pao}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
      SEARXNG_URL: http://search:8080
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    profiles: ["app"]
    build: {context: .., dockerfile: infra/api.Dockerfile}
    env_file: ../.env
    environment: *backend-env
    command: ["uvicorn", "pao.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 512m
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    profiles: ["app"]
    build: {context: .., dockerfile: infra/api.Dockerfile}
    env_file: ../.env
    environment: *backend-env
    command: ["arq", "pao.runtime.WorkerSettings"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 384m
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    profiles: ["app"]
    build: {context: .., dockerfile: infra/web.Dockerfile}
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 512m
    depends_on: [api]
volumes:
  postgres-data:
    name: ${PAO_POSTGRES_VOLUME:-pao_postgres-data}
    external: ${PAO_EXTERNAL_STORAGE:-false}
  redis-data:
    name: ${PAO_REDIS_VOLUME:-pao_redis-data}
    external: ${PAO_EXTERNAL_STORAGE:-false}
