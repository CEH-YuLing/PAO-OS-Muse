name: pao-acos-local
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pao
      POSTGRES_DB: pao_acos_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate local .env first}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["acos-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pao -d pao_acos_local"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate local .env first}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["acos-redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  acos-postgres:
  acos-redis:
