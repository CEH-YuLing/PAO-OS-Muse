name: pao-os-muse
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pao
      POSTGRES_DB: pao_muse_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sandbox setup first}
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["muse-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pao -d pao_muse_local"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run sandbox setup first}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:26379:6379"]
    volumes: ["muse-redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  muse-postgres:
  muse-redis:
