[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pao-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "PyJWT>=2.15.1,<3", "pwdlib[argon2]>=0.2,<1",
  "cryptography>=50.0.2,<51", "httpx>=0.28,<1", "arq>=0.26,<1", "pgvector>=0.4,<0.5", "tzdata>=2026.4",
  "temporalio>=1.33,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
voice = ["faster-whisper>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["apps/api", "packages/cli-runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
