name: PAO release regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pao
          POSTGRES_PASSWORD: pao
          POSTGRES_DB: pao_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pao -d pao_test" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PYTHONPATH: apps/api
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DATABASE_URL: postgresql+asyncpg://pao:pao@127.0.0.1:5432/pao_test
      PAO_TEST_DATABASE_URL: postgresql+asyncpg://pao:pao@127.0.0.1:5432/pao_test
      REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: synthetic-ci-only-key-not-production-0001
      PAO_ARQ_WALL_CLOCK_TESTS: '1'
      META_ENABLED: 'false'
      META_WRITE_ENABLED: 'false'
      GOOGLE_ADS_ENABLED: 'false'
      TELEGRAM_ENABLED: 'false'
      TEMPORAL_ENABLED: 'false'
      ADS_AUTOPILOT_GLOBAL_ENABLED: 'false'
      INTEGRATION_ENCRYPTION_KEY: ''
      BUSINESS_PLANNING_ENABLED: 'false'
      PAO_BUILD_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.lock
      - run: npm ci
      - name: Single Linux release gate (synthetic, not production acceptance)
        env:
          PAO_CI_RESTORE: '1'
          PAO_CI_RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: python scripts/ci_entry.py
      - name: Keep synthetic regression evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-results
          path: |
            .runtime/backend-full.xml
            .runtime/ci-result.json
            .runtime/js-security.json
          if-no-files-found: warn
          retention-days: 7
